ink)"/><text x="675" y="221" text-anchor="middle" font-size="17">C</text><circle cx="905" cy="130" r="19" fill="#172a40" stroke="url(#ink)"/><text x="905" y="136" text-anchor="middle" font-size="17">D</text><circle cx="1060" cy="70" r="19" fill="#172a40" stroke="url(#ink)"/><text x="1060" y="76" text-anchor="middle" font-size="17">E</text><circle cx="1060" cy="215" r="19" fill="#172a40" stroke="url(#ink)"/><text x="1060" y="221" text-anchor="middle" font-size="17">F</text><text x="520" y="292" class="small" font-size="11">SIX NODES. A BRIDGE. AN ALTERNATIVE.</text></svg>